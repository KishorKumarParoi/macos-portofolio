<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E1E38"/>
      <stop offset="40%" stop-color="#14142B"/>
      <stop offset="100%" stop-color="#080816"/>
    </linearGradient>

    <!-- Neon Rim Border -->
    <linearGradient id="rimGrad" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Core Orb Gradient -->
    <radialGradient id="coreOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#6366F1"/>
      <stop offset="85%" stop-color="#A855F7"/>
      <stop offset="100%" stop-color="#7E22CE"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- macOS Dock Squircle Base -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Neural Mesh Grid lines -->
  <path d="M28 64H100" stroke="#38BDF8" stroke-opacity="0.18" stroke-dasharray="3 3"/>
  <path d="M64 28V100" stroke="#818CF8" stroke-opacity="0.18" stroke-dasharray="3 3"/>
  <circle cx="64" cy="64" r="44" stroke="#A855F7" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Outer Revolving AI Orbit Rings -->
  <ellipse cx="64" cy="64" rx="38" ry="18" transform="rotate(-30 64 64)" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.85" filter="url(#neonGlow)"/>
  <ellipse cx="64" cy="64" rx="38" ry="18" transform="rotate(30 64 64)" stroke="#C084FC" stroke-width="2" stroke-opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Center Quantum AI Core -->
  <circle cx="64" cy="64" r="21" fill="url(#coreOrb)" filter="url(#neonGlow)"/>
  <circle cx="64" cy="64" r="21" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="1.5"/>

  <!-- Bot Face / Neural Eyes -->
  <circle cx="56" cy="61" r="3.2" fill="#FFFFFF"/>
  <circle cx="72" cy="61" r="3.2" fill="#FFFFFF"/>
  <path d="M57 70C59 72.5 69 72.5 71 70" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Orbiting Quantum Nodes -->
  <circle cx="34" cy="46" r="3" fill="#38BDF8" filter="url(#neonGlow)"/>
  <circle cx="94" cy="82" r="3" fill="#C084FC" filter="url(#neonGlow)"/>
  <circle cx="92" cy="48" r="2.5" fill="#34D399" filter="url(#neonGlow)"/>

  <!-- AI Badge Inset Top Right -->
  <g transform="translate(86, 12)">
    <rect width="26" height="15" rx="7.5" fill="#0284C7"/>
    <text x="13" y="11" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">AI</text>
  </g>
</svg>
